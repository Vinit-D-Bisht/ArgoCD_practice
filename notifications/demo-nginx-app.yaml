apiVersion: argoproj.io/v1alpha1   
kind: Application                  
metadata:
  name: nginx-demo
  namespace: argocd                
  annotations:
    # The email notifier must be configured in argocd-notifications-cm.yaml, The `.email` is the name of the notifier, i.e, `service.email` in the argocd-notifications-cm.yaml.
    # Subscribe to notifications when the app health is degraded.
    notifications.argoproj.io/subscribe.on-health-degraded.email: "USER@gmail.com"  # you can add multiple email ids separated by comma like "<receiver@example.com>, <receiver2@example.com>"
    # Subscribe to notifications when the app is successfully deployed.
    notifications.argoproj.io/subscribe.on-deployed.email: "USER@gmail.com"
spec:
  project: default
  source:
    repoURL: https://github.com/Vinit-D-Bisht/ArgoCD_practice.git
    targetRevision: main           
    path: ui_deployment
  destination:
    server: https://kubernetes.default.svc
    namespace: default             
  syncPolicy:                      
    automated:                     
      prune: true                 
      selfHeal: true               
    syncOptions:                 # Additional sync options
      - CreateNamespace=true  
