apiVersion: argoproj.io/v1alpha1   
kind: Application                  
metadata:
  name: master-app
  namespace: argocd                
spec:
  project: default                 
  source:
    repoURL: https://github.com/Vinit-D-Bisht/ArgoCD_practice.git
    targetRevision: main           
    path: app-of-apps-approach/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: default             
  syncPolicy:                      
    automated:                     
      prune: true                 
      selfHeal: true               
    syncOptions:                 
      - CreateNamespace=true 
