apiVersion: argoproj.io/v1alpha1   
kind: Application                  
metadata:
  name: nginx
  namespace: argocd                
spec:
  project: default
  source:
    repoURL: https://github.com/Vinit-D-Bisht/ArgoCD_practice.git
    targetRevision: main           
    path: ui_deployment
  destination:
    server: https://kubernetes.default.svc
    namespace: default             
  syncPolicy:                      
    automated:                     
      prune: true                 
      selfHeal: true               
    syncOptions:                 # Additional sync options
      - CreateNamespace=true  
