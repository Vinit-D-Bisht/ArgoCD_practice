apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  labels:
    app: apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apps
  template:
    metadata:
      labels:
        app: apps
    spec:
      containers:
      - name: django-app
        image: vinitbisht/todo-project:v1.0
        ports:
        - containerPort: 8080
